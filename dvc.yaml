stages:
  split:
    cmd: uv run python scripts/split_data.py
    deps:
      - scripts/split_data.py
      - src/bank_marketing/periods.py
      - src/bank_marketing/plotting.py
      - data/raw/bank-additional-full.csv
    params:
      - split
    outs:
      - data/initial
      - data/incoming
      - report_assets/pr2/split_out.txt:
          cache: false
      - report_assets/pr2/img/рис_1_1.png:
          cache: false
      - reports/figures/pr2/рис_1_1.png:
          cache: false
  eda_initial:
    cmd: uv run python scripts/eda_initial.py
    deps:
      - scripts/eda_initial.py
      - src/bank_marketing/stats.py
      - src/bank_marketing/plotting.py
      - data/initial
      - data/incoming
    outs:
      - report_assets/pr2/eda_initial_out.txt:
          cache: false
      - report_assets/pr2/img/рис_1_2.png:
          cache: false
      - report_assets/pr2/img/рис_1_3.png:
          cache: false
      - report_assets/pr2/img/рис_1_4.png:
          cache: false
      - report_assets/pr2/img/рис_1_5.png:
          cache: false
      - reports/figures/pr2/рис_1_2.png:
          cache: false
      - reports/figures/pr2/рис_1_3.png:
          cache: false
      - reports/figures/pr2/рис_1_4.png:
          cache: false
      - reports/figures/pr2/рис_1_5.png:
          cache: false
  validate:
    cmd: uv run python scripts/validate.py
    deps:
      - scripts/validate.py
      - src/bank_marketing/validation.py
      - src/bank_marketing/stats.py
      - data/initial
      - data/incoming
    outs:
      - models/reference/data_reference.json:
          cache: false
      - reports/validation:
          cache: false
      - report_assets/pr2/validate_out.txt:
          cache: false
