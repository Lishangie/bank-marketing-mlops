split:
  initial_share: 0.6     # целевая доля исходной части
  n_batches: 4
  seed: 23               # на случай случайного разбиения, здесь не используется
train:
  test_from: "2008-08"   # тестовая выборка ПР4: август и октябрь 2008 г.
  cv_splits: 5           # TimeSeriesSplit, расширяющееся окно
  top_k: 0.1             # доля базы в списке обзвона для Lift@k и Recall@k
  seed: 23
  select_delta: 0.005    # правило выбора: отставание по PR-AUC меньше этой величины
  select_min_folds: 4    # ...и лучшая выигрывает меньше чем в стольких блоках — берётся более простая
evaluate:                # ПР4: протокол оценки, зафиксирован до расчётов на тестовой выборке
  bootstrap: 1000        # число бутстреп-выборок для 95 %-ных интервалов
  seed: 23
  cost_fp: 150           # руб.: звонок без результата (5 мин работы оператора)
  cost_fn: 3000          # руб.: упущенная маржа по вкладу клиента, которому не позвонили
  accept:                # пороги приемки на тестовой выборке (требование M-01)
    pr_auc_lift: 1.2     # PR-AUC не ниже 1,2 × доля отклика в тестовой выборке
    pr_auc_gain_rule: 0.005  # превосходство над правилом по PR-AUC; ДИ разности без нуля
    lift_k: 1.2          # Lift@10 % не ниже
    roc_auc: 0.55        # ROC-AUC не ниже
  monitor:               # пороги проверки на порциях (правила мониторинга ПР5)
    lift_k: 1.2          # Lift@10 % ниже — переобучение
    psi_warn: 0.1        # PSI признака 0,1–0,25 — предупреждение
    psi_alert: 0.25      # PSI признака выше — переобучение
    calib_pp: 0.05       # |средняя прогнозная − фактическая доля отклика| больше — переобучение
  psi_features: [macro_pc1, cons.conf.idx, campaign_capped, age, contact]
service:                 # ПР5: система; правила зафиксированы до подачи порций
  db: data/system/bank.db
  feature_set: delta     # new + euribor_delta_3m
  holdout_share: 0.3     # последние 30 % записей порции (по row_id) — для сравнения претендента
  candidates:            # семейства претендента; LR без балансировки — вероятности откалиброваны
    lr: {C: 0.1}
    catboost: {depth: 3, iterations: 500, learning_rate: 0.03, l2_leaf_reg: 3}
  replace:               # претендент заменяет действующую, если на отложенной части порции
    pr_auc_tol: 0.005    # PR-AUC не хуже больше чем на 0,005 И |прогноз − факт| меньше
  kpi_change_pp: 0.05    # изменение доли выше порога или доли отклика больше 5 п. п. — предупреждение
  out_of_domain_max: 0.05  # доля записей со ставкой вне области обучения модели — переобучение
  max_batch_seconds: 60  # N-02
  max_api_ms: 200        # N-03
