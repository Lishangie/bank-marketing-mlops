split:
  initial_share: 0.6     # целевая доля исходной части
  n_batches: 4
  seed: 23               # на случай случайного разбиения, здесь не используется
train:
  test_from: "2008-08"   # тестовая выборка ПР4: август и октябрь 2008 г.
  cv_splits: 5           # TimeSeriesSplit, расширяющееся окно
  top_k: 0.1             # доля базы в списке обзвона для Lift@k и Recall@k
  seed: 23
  select_delta: 0.005    # правило выбора: отставание по PR-AUC меньше этой величины
  select_min_folds: 4    # ...и лучшая выигрывает меньше чем в стольких блоках — берётся более простая
